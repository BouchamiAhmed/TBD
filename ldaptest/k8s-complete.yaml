---
# Complete deployment: OpenLDAP + GraphQL Service
# Deploy with: kubectl apply -f k8s-complete.yaml

# ============================================
# OPENLDAP SERVER
# ============================================

---
# Namespace for OpenLDAP
apiVersion: v1
kind: Namespace
metadata:
  name: openldap

---
# PersistentVolumeClaim for LDAP data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap-data
  namespace: openldap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path  # Change to your storage class

---
# ConfigMap with initial LDAP structure
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-init
  namespace: openldap
data:
  init.ldif: |
    # Base organizational units
    dn: ou=internal,dc=dbsaas,dc=local
    objectClass: organizationalUnit
    ou: internal

    dn: ou=external,dc=dbsaas,dc=local
    objectClass: organizationalUnit
    ou: external

    dn: ou=users,ou=internal,dc=dbsaas,dc=local
    objectClass: organizationalUnit
    ou: users

    dn: ou=users,ou=external,dc=dbsaas,dc=local
    objectClass: organizationalUnit
    ou: users

    dn: ou=groups,dc=dbsaas,dc=local
    objectClass: organizationalUnit
    ou: groups

    # Admin group (internal)
    dn: cn=admins,ou=groups,dc=dbsaas,dc=local
    objectClass: posixGroup
    objectClass: top
    cn: admins
    gidNumber: 1001
    description: Internal administrators

    # Clients group (external)
    dn: cn=clients,ou=groups,dc=dbsaas,dc=local
    objectClass: posixGroup
    objectClass: top
    cn: clients
    gidNumber: 2001
    description: External database users

---
# OpenLDAP Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: openldap
  labels:
    app: openldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
      - name: openldap
        image: osixia/openldap:1.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 389
          name: ldap
        - containerPort: 636
          name: ldaps
        env:
        - name: LDAP_ORGANISATION
          value: "DBaaS Platform"
        - name: LDAP_DOMAIN
          value: "dbsaas.local"
        - name: LDAP_BASE_DN
          value: "dc=dbsaas,dc=local"
        - name: LDAP_ADMIN_PASSWORD
          value: "admin123"
        - name: LDAP_CONFIG_PASSWORD
          value: "config123"
        - name: LDAP_READONLY_USER
          value: "true"
        - name: LDAP_READONLY_USER_USERNAME
          value: "readonly"
        - name: LDAP_READONLY_USER_PASSWORD
          value: "readonly123"
        - name: LDAP_RFC2307BIS_SCHEMA
          value: "false"
        - name: LDAP_BACKEND
          value: "mdb"
        - name: LDAP_TLS
          value: "false"
        - name: LDAP_TLS_ENFORCE
          value: "false"
        - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
          value: "true"
        - name: KEEP_EXISTING_CONFIG
          value: "false"
        volumeMounts:
        - name: ldap-data
          mountPath: /var/lib/ldap
        - name: ldap-config
          mountPath: /etc/ldap/slapd.d
        - name: ldap-init
          mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: ldap-data
        persistentVolumeClaim:
          claimName: openldap-data
      - name: ldap-config
        emptyDir: {}
      - name: ldap-init
        configMap:
          name: openldap-init

---
# OpenLDAP Service - ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: openldap
  labels:
    app: openldap
spec:
  type: ClusterIP
  ports:
  - port: 389
    targetPort: 389
    protocol: TCP
    name: ldap
  selector:
    app: openldap

---
# OpenLDAP Service - LoadBalancer (for external access)
apiVersion: v1
kind: Service
metadata:
  name: openldap-lb
  namespace: openldap
  labels:
    app: openldap
spec:
  type: LoadBalancer
  ports:
  - port: 389
    targetPort: 389
    protocol: TCP
    name: ldap
  selector:
    app: openldap

# ============================================
# GRAPHQL AUTHENTICATION SERVICE
# ============================================

---
# Namespace for ldaptest
apiVersion: v1
kind: Namespace
metadata:
  name: ldaptest

---
# ConfigMap for LDAP configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldaptest-config
  namespace: ldaptest
data:
  LDAP_HOST: "openldap.openldap.svc.cluster.local"
  PORT: "8090"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldaptest-graphql
  namespace: ldaptest
  labels:
    app: ldaptest-graphql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldaptest-graphql
  template:
    metadata:
      labels:
        app: ldaptest-graphql
    spec:
      containers:
      - name: ldaptest-graphql
        image: ldaptest-graphql:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8090
          name: graphql
        envFrom:
        - configMapRef:
            name: ldaptest-config
        env:
        - name: JWT_SECRET
          value: "your-secret-key-change-in-production"
        livenessProbe:
          httpGet:
            path: /query
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /query
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# Service - ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: ldaptest-graphql-service
  namespace: ldaptest
  labels:
    app: ldaptest-graphql
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: graphql
  selector:
    app: ldaptest-graphql

---
# Service - LoadBalancer (for external access)
apiVersion: v1
kind: Service
metadata:
  name: ldaptest-graphql-lb
  namespace: ldaptest
  labels:
    app: ldaptest-graphql
spec:
  type: LoadBalancer
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: graphql
  selector:
    app: ldaptest-graphql

---
# Traefik IngressRoute (if using Traefik)
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ldaptest-graphql-ingress
  namespace: ldaptest
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`graphql.dbsaas.local`) || PathPrefix(`/graphql`)
    kind: Rule
    services:
    - name: ldaptest-graphql-service
      port: 8090
