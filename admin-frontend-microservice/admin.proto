syntax = "proto3";

package admin.v1;

option go_package = "admin-service/pkg/pb";

import "google/protobuf/timestamp.proto";

service AdminService {
  // Existing services
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  rpc GetUserDatabases(GetUserDatabasesRequest) returns (GetUserDatabasesResponse);
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse);
  rpc GetAllNamespaces(GetAllNamespacesRequest) returns (GetAllNamespacesResponse);
  
  // Enhanced LDAP Management
  rpc ListLDAPUsers(ListLDAPUsersRequest) returns (ListLDAPUsersResponse);
  rpc GetLDAPUser(GetLDAPUserRequest) returns (GetLDAPUserResponse);
  rpc CreateLDAPUser(CreateLDAPUserRequest) returns (CreateLDAPUserResponse);
  rpc UpdateLDAPUser(UpdateLDAPUserRequest) returns (UpdateLDAPUserResponse);
  rpc DeleteLDAPUser(DeleteLDAPUserRequest) returns (DeleteLDAPUserResponse);
  rpc UpdateLDAPPassword(UpdateLDAPPasswordRequest) returns (UpdateLDAPPasswordResponse);
  
  // Enhanced Namespace Management
  rpc GetNamespaceDetails(GetNamespaceDetailsRequest) returns (GetNamespaceDetailsResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc CleanupNamespaceResources(CleanupNamespaceResourcesRequest) returns (CleanupNamespaceResourcesResponse);
  
  // Resource Management
  rpc ListNamespaceResources(ListNamespaceResourcesRequest) returns (ListNamespaceResourcesResponse);
  rpc DeleteNamespaceResource(DeleteNamespaceResourceRequest) returns (DeleteNamespaceResourceResponse);
  
  // Admin Operations
  rpc GetSystemHealth(GetSystemHealthRequest) returns (GetSystemHealthResponse);
  rpc GetAdminStats(GetAdminStatsRequest) returns (GetAdminStatsResponse);
}

// Existing message types
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string token = 2;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
}

message RegisterResponse {
  User user = 1;
  string token = 2;
}

message User {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateDatabaseRequest {
  string name = 1;
  string username = 2;
  string password = 3;
  string type = 4;
  int32 user_id = 5;
}

message CreateDatabaseResponse {
  string name = 1;
  string host = 2;
  string port = 3;
  string username = 4;
  string type = 5;
  string status = 6;
  string message = 7;
  string namespace = 8;
  string admin_url = 9;
  string admin_type = 10;
}

message GetUserDatabasesRequest {
  string namespace = 1;
}

message GetUserDatabasesResponse {
  bool success = 1;
  string namespace = 2;
  repeated Database databases = 3;
  int32 count = 4;
}

message Database {
  string name = 1;
  string type = 2;
  string status = 3;
  string namespace = 4;
  string user_id = 5;
  string admin_url = 6;
  string admin_type = 7;
  google.protobuf.Timestamp created_at = 8;
}

message DeleteDatabaseRequest {
  string namespace = 1;
  string name = 2;
}

message DeleteDatabaseResponse {
  bool success = 1;
  string message = 2;
  string name = 3;
  string namespace = 4;
}

message GetAllNamespacesRequest {
  // Empty - gets all namespaces
}

message GetAllNamespacesResponse {
  bool success = 1;
  string message = 2;
  repeated NamespaceInfo namespaces = 3;
}

message NamespaceInfo {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  int32 database_count = 3;
  string status = 4;
}

// LDAP Management Messages
message ListLDAPUsersRequest {
  string user_type = 1; // "internal", "external", or "" for all
  int32 page = 2;
  int32 limit = 3;
}

message ListLDAPUsersResponse {
  bool success = 1;
  string message = 2;
  repeated LDAPUser users = 3;
  int32 total_count = 4;
  int32 page = 5;
  int32 limit = 6;
}

message LDAPUser {
  string dn = 1;
  string uid = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string user_type = 6; // "internal" or "external"
  google.protobuf.Timestamp created_at = 7;
  string status = 8;
}

message GetLDAPUserRequest {
  string username = 1;
}

message GetLDAPUserResponse {
  bool success = 1;
  string message = 2;
  LDAPUser user = 3;
}

message CreateLDAPUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
  string user_type = 6; // "internal" or "external"
}

message CreateLDAPUserResponse {
  bool success = 1;
  string message = 2;
  LDAPUser user = 3;
}

message UpdateLDAPUserRequest {
  string username = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string user_type = 5;
}

message UpdateLDAPUserResponse {
  bool success = 1;
  string message = 2;
  LDAPUser user = 3;
}

message DeleteLDAPUserRequest {
  string username = 1;
  bool force = 2; // Force delete even if user has resources
}

message DeleteLDAPUserResponse {
  bool success = 1;
  string message = 2;
  string username = 3;
  repeated string deleted_resources = 4;
}

message UpdateLDAPPasswordRequest {
  string username = 1;
  string new_password = 2;
}

message UpdateLDAPPasswordResponse {
  bool success = 1;
  string message = 2;
  string username = 3;
}

// Enhanced Namespace Management
message GetNamespaceDetailsRequest {
  string namespace = 1;
}

message GetNamespaceDetailsResponse {
  bool success = 1;
  string message = 2;
  NamespaceDetails details = 3;
}

message NamespaceDetails {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  int32 database_count = 3;
  string status = 4;
  repeated KubernetesResource resources = 5;
  string owner_uid = 6;
  map<string, string> labels = 7;
  map<string, string> annotations = 8;
}

message DeleteNamespaceRequest {
  string namespace = 1;
  bool force = 2; // Force delete with all resources
}

message DeleteNamespaceResponse {
  bool success = 1;
  string message = 2;
  string namespace = 3;
  repeated string deleted_resources = 4;
}

message CleanupNamespaceResourcesRequest {
  string namespace = 1;
  repeated string resource_types = 2; // e.g., ["deployments", "services", "configmaps"]
}

message CleanupNamespaceResourcesResponse {
  bool success = 1;
  string message = 2;
  string namespace = 3;
  repeated ResourceCleanupResult cleanup_results = 4;
}

message ResourceCleanupResult {
  string resource_type = 1;
  string resource_name = 2;
  bool deleted = 3;
  string error_message = 4;
}

// Resource Management
message ListNamespaceResourcesRequest {
  string namespace = 1;
  string resource_type = 2; // "deployments", "services", "configmaps", etc.
}

message ListNamespaceResourcesResponse {
  bool success = 1;
  string message = 2;
  string namespace = 3;
  repeated KubernetesResource resources = 4;
}

message KubernetesResource {
  string name = 1;
  string kind = 2;
  string namespace = 3;
  google.protobuf.Timestamp created_at = 4;
  map<string, string> labels = 5;
  string status = 6;
  string owner_reference = 7;
}

message DeleteNamespaceResourceRequest {
  string namespace = 1;
  string resource_type = 2;
  string resource_name = 3;
}

message DeleteNamespaceResourceResponse {
  bool success = 1;
  string message = 2;
  string namespace = 3;
  string resource_type = 4;
  string resource_name = 5;
}

// Admin Operations
message GetSystemHealthRequest {
  // Empty
}

message GetSystemHealthResponse {
  bool success = 1;
  string message = 2;
  SystemHealth health = 3;
}

message SystemHealth {
  string status = 1; // "healthy", "degraded", "unhealthy"
  ServiceStatus database = 2;
  ServiceStatus kubernetes = 3;
  ServiceStatus ldap = 4;
  ServiceStatus traefik = 5;
  map<string, string> metrics = 6;
}

message ServiceStatus {
  string status = 1; // "connected", "disconnected", "error"
  string message = 2;
  google.protobuf.Timestamp last_check = 3;
}

message GetAdminStatsRequest {
  // Empty
}

message GetAdminStatsResponse {
  bool success = 1;
  string message = 2;
  AdminStats stats = 3;
}

message AdminStats {
  int32 total_users = 1;
  int32 total_namespaces = 2;
  int32 total_databases = 3;
  int32 active_deployments = 4;
  map<string, int32> database_types = 5; // e.g., {"mysql": 5, "postgresql": 3}
  map<string, int32> user_types = 6; // e.g., {"internal": 2, "external": 8}
  google.protobuf.Timestamp last_updated = 7;
}